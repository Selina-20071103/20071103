    <style>
        :root {
            --washi-bg: #f7f4ed;
            --vermilion: #c84b31;
            --matcha: #5a7865;
            --charcoal: #2d2d2a;
            --gold: #d4af37;
            --wood-dark: #3a2e2b;
            --disabled-gray: #e2dfd8;
        }

        body {
            background-color: var(--washi-bg);
            color: var(--charcoal);
            font-family: 'Zen Maru Gothic', 'Noto Serif JP', serif, sans-serif;
            background-image: radial-gradient(#d3cbbd 0.75px, transparent 0.75px);
            background-size: 16px 16px;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* 櫻花飄落背景層 */
        .sakura-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .petal {
            position: absolute;
            background: linear-gradient(135deg, #ffd1dc, #ffb7c5);
            border-radius: 150% 0 150% 0;
            opacity: 0.7;
            animation: animatePetal 10s linear infinite;
        }

        @keyframes animatePetal {
            0% {
                top: -10%;
                transform: translateX(0) rotate(0deg);
                opacity: 0.8;
            }
            100% {
                top: 105%;
                transform: translateX(100px) rotate(360deg);
                opacity: 0.2;
            }
        }

        /* 日式朱印章效果 */
        .hanko-stamp {
            border: 2px solid var(--vermilion);
            color: var(--vermilion);
            border-radius: 4px;
            padding: 2px 8px;
            font-family: 'Noto Serif JP', serif;
            font-weight: 700;
            display: inline-block;
            transform: rotate(-5deg);
            box-shadow: 0 0 2px rgba(200, 75, 49, 0.3);
        }

        /* 富士山微圖騰背景裝飾 */
        .fuji-bg {
            position: fixed;
            bottom: -20px;
            right: -20px;
            opacity: 0.05;
