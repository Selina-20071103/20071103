<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>今天吃什麼？ - 黃色小魚抽籤機</title>
    <style>
        /* ===== 全局與字型設定 ===== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif, "微軟正黑體";
            background-color: #FFF9E6;
            background-image: radial-gradient(#FFE599 1.5px, transparent 1.5px);
            background-size: 24px 24px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
            color: #4A3E3D;
        }

        /* ===== 背景動態飾品（泡泡與小魚） ===== */
        .background-decorations {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
            pointer-events: none;
        }

        .bubble {
            position: absolute;
            background-color: rgba(255, 224, 130, 0.5);
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.8);
            animation: float 6s infinite ease-in-out;
        }

        .bubble-1 { width: 60px; height: 60px; left: 10%; bottom: -60px; animation-delay: 0s; }
        .bubble-2 { width: 40px; height: 40px; left: 80%; bottom: -40px; animation-delay: 2s; }
        .bubble-3 { width: 50px; height: 50px; left: 50%; bottom: -50px; animation-delay: 4s; }

        @keyframes float {
            0% { transform: translateY(0) scale(1); opacity: 0.8; }
            50% { transform: translateY(-50vh) scale(1.1); opacity: 0.6; }
            100% { transform: translateY(-100vh) scale(1); opacity: 0; }
        }

        .fish {
            position: absolute;
            font-size: 2.5rem;
            animation: swim 12s infinite linear;
        }

        .fish-left { top: 20%; left: -50px; }
        .fish-right { top: 75%; right: -50px; transform: scaleX(-1); animation-delay: 6s; }

        @keyframes swim {
            0% { transform: translateX(-10vw); }
            50% { transform: translateX(110vw) translateY(-20px); }
            100% { transform: translateX(110vw); }
        }

        /* ===== 卡片主容器 ===== */
        .card-container {
            background: #FFFFFF;
            border: 4px solid #FFD15C;
            border-radius: 28px;
            padding: 2.5rem 2rem;
            box-shadow: 0 12px 30px rgba(255, 184, 0, 0.25);
            text-align: center;
            max-width: 420px;
            width: 90%;
            z-index: 1;
            position: relative;
            transition: transform 0.3s ease;
        }

        /* 魚魚徽章 */
        .fish-badge {
            display: inline-block;
            background-color: #FFF3C4;
            color: #D97706;
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
        }

        /* 大標題 */
        .title {
            font-size: 2.2rem;
            color: #333333;
            margin-bottom: 1.5rem;
            min-height: 3.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            word-break: break-word;
        }

        /* 食物圖片 */
        .image-container {
            width: 100%;
            height: 220px;
            border-radius: 18px;
            overflow: hidden;
            margin-bottom: 1.5rem;
            border: 3px solid #FFE599;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.05);
        }

        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .image-container img:hover {
            transform: scale(1.05);
        }

        /* ===== 按鈕區塊與樣式 ===== */
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px 24px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            text-decoration: none;
            border: none;
            transition: all 0.2s ease;
        }

        /* 主按鈕：點我抽籤 */
        .btn-primary {
            background-color: #FFC107;
            color: #4A2800;
            box-shadow: 0 6px 0 #D99B00, 0 8px 15px rgba(255, 193, 7, 0.4);
        }

        .btn-primary:hover {
            background-color: #FFCA28;
            transform: translateY(-2px);
            box-shadow: 0 8px 0 #D99B00, 0 10px 20px rgba(255, 193, 7, 0.4);
        }

        .btn-primary:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #D99B00;
        }

        /* 次要按鈕：馬上出發 */
        .btn-secondary {
            background-color: #4ADE80;
            color: #064E3B;
            box-shadow: 0 6px 0 #16A34A, 0 8px 15px rgba(74, 222, 128, 0.3);
        }

        .btn-secondary:hover {
            background-color: #6EE7B7;
            transform: translateY(-2px);
            box-shadow: 0 8px 0 #16A34A, 0 10px 20px rgba(74, 222, 128, 0.3);
        }

        .btn-secondary:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #16A34A;
        }

        /* 隱藏元素工具類別 */
        .hidden {
            display: none !important;
        }

        /* ===== 動畫效果 ===== */
        /* 彈跳動畫 (Pop Animation) */
        .bounce-pop {
            animation: bouncePop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes bouncePop {
            0% {
                transform: scale(0.3);
                opacity: 0;
            }
            50% {
                transform: scale(1.15);
            }
            70% {
                transform: scale(0.95);
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <div class="background-decorations">
        <!-- 裝飾用背景泡泡與小魚 -->
        <div class="bubble bubble-1"></div>
        <div class="bubble bubble-2"></div>
        <div class="bubble bubble-3"></div>
        <div class="fish fish-left">🐟</div>
        <div class="fish fish-right">🐠</div>
    </div>

    <main class="card-container">
        <div class="fish-badge">🐟 魚魚美食導航 🐠</div>
        
        <!-- 大標題區域 -->
        <h1 id="food-title" class="title">今天吃什麼？</h1>

        <!-- 食物圖片容器 -->
        <div id="image-container" class="image-container hidden">
            <img id="food-image" src="" alt="食物照片">
        </div>

        <!-- 按鈕區塊 -->
        <div class="button-group">
            <button id="draw-btn" class="btn btn-primary">
                <span class="btn-icon">🎲</span> 點我抽籤
            </button>
            <a id="map-btn" class="btn btn-secondary hidden" href="#" target="_blank" rel="noopener noreferrer">
                <span class="btn-icon">📍</span> 馬上出發
            </a>
        </div>
    </main>

    <script>
        // 確保 HTML 載入完成才執行程式，避免發生 null 錯誤
        document.addEventListener('DOMContentLoaded', () => {

            // 1. 食物資料庫（包含名稱與對應的網路圖片連結）
            const foodList = [
                {
                    name: "排骨飯 🍱",
                    image: "https://images.unsplash.com/photo-1544025162-d76694265947?auto=format&fit=crop&w=600&q=80"
                },
                {
                    name: "水餃 🥟",
                    image: "https://images.unsplash.com/photo-1496116218417-1a781b1c416c?auto=format&fit=crop&w=600&q=80"
                },
                {
                    name: "麥當勞 🍔",
                    image: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=600&q=80"
                },
                {
                    name: "義大利麵 🍝",
                    image: "https://images.unsplash.com/photo-1551183053-bf91a1d81141?auto=format&fit=crop&w=600&q=80"
                },
                {
                    name: "便利商店 🏪",
                    image: "https://images.unsplash.com/photo-1578916171728-46686eac8d58?auto=format&fit=crop&w=600&q=80"
                }
            ];

            // 2. 取得 DOM 元素
            const foodTitle = document.getElementById('food-title');
            const drawBtn = document.getElementById('draw-btn');
            const mapBtn = document.getElementById('map-btn');
            const imageContainer = document.getElementById('image-container');
            const foodImage = document.getElementById('food-image');

            let isRolling = false; // 紀錄目前是否正在抽籤中

            // 3. 點擊按鈕抽籤事件
            drawBtn.addEventListener('click', () => {
                if (isRolling) return; // 如果正在抽籤中，防止重複點擊
                isRolling = true;

                // 隱藏地圖按鈕與舊動畫類別
                mapBtn.classList.add('hidden');
                foodTitle.classList.remove('bounce-pop');

                let count = 0;
                const totalRolls = 15; // 切換次數
                const speed = 80;     // 每次切換間隔（毫秒）

                // 快速輪播效果（類似 Slot Machine）
                const interval = setInterval(() => {
                    const randomIndex = Math.floor(Math.random() * foodList.length);
                    foodTitle.innerText = foodList[randomIndex].name;
                    count++;

                    if (count >= totalRolls) {
                        clearInterval(interval);
                        
                        // 決定最終抽中的食物
                        const finalResult = foodList[Math.floor(Math.random() * foodList.length)];
                        
                        // 1. 更新標題文字
                        foodTitle.innerText = finalResult.name;
                        
                        // 2. 加上生動彈跳動畫
                        foodTitle.classList.add('bounce-pop');

                        // 3. 顯示圖片
                        foodImage.src = finalResult.image;
                        imageContainer.classList.remove('hidden');

                        // 4. 設定 Google Maps 導航連結（去除表情符號純留名稱搜尋）
                        const cleanName = finalResult.name.replace(/[\u{1F600}-\u{1F64F}\u{1F300}-\u{1F5FF}\u{1F680}-\u{1F6FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}]/gu, '').trim();
                        mapBtn.href = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(cleanName)}`;
                        mapBtn.classList.remove('hidden');

                        isRolling = false; // 結束抽籤
                    }
                }, speed);
            });
        });
    </script>
</body>
</html>
